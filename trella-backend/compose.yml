services:

  db:
    # pgvector/pgvector:pg18 is the official postgres:18 image + the `vector`
    # extension preinstalled (drop-in: same PGDATA layout, so the existing
    # app-db-data volume is reused and data is preserved). Needed for Phase 9
    # (Semantic Search / RAG): enables `CREATE EXTENSION vector`.
    image: pgvector/pgvector:pg18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

volumes:
  app-db-data:
